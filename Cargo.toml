[package]
name = "haiip-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone PPTP client for Hai-IP on Linux"

[lib]
name = "haiip_client"
path = "src/lib.rs"

[[bin]]
name = "haiip"
path = "src/main.rs"

[dependencies]
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
des = "0.8"
libc = "0.2"
md4 = "0.10"
rand = "0.8"
rpassword = "7.4"
sha1 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.46", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
